name: nile-smoke

# Manual only, and gated behind a GitHub Environment.
#
# This is the one workflow that touches a network and signs with a real key.
# It is never on push or pull_request: a live run needs a funded testnet
# account, and an account reachable from every branch is an account waiting to
# be drained by a pull request that changes the destination.
on:
  workflow_dispatch:
    inputs:
      amount_sun:
        description: "TRX to send, in sun"
        required: true
        default: "1000000"

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: nile
    steps:
      - uses: actions/checkout@v4

      - name: Let git reach private Reuna repositories
        env:
          TOKEN: ${{ secrets.REUNA_CI_TOKEN }}
        run: |
          test -n "$TOKEN"
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"

      - name: Build the GMP prerequisite without host privileges
        env:
          GMP_VERSION: "6.3.0"
          GMP_SHA256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898
        run: |
          archive="$RUNNER_TEMP/gmp-$GMP_VERSION.tar.xz"
          source_dir="$(mktemp --directory "$RUNNER_TEMP/gmp-build.XXXXXX")"
          gmp_prefix="$RUNNER_TEMP/ocaml-tron-gmp"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --output "$archive" \
            "https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz"
          echo "$GMP_SHA256  $archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$source_dir" --strip-components 1
          cd "$source_dir" && ./configure --prefix="$gmp_prefix" --with-pic
          make -j"$(nproc)" && make install
          echo "CPATH=$gmp_prefix/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$gmp_prefix/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$gmp_prefix/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$gmp_prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Pin the peer packages
        run: |
          opam pin add -yn web3-codec-basen    https://github.com/reuna-labs/ocaml-web3-codec.git
          opam pin add -yn web3-codec-base58   https://github.com/reuna-labs/ocaml-web3-codec.git
          opam pin add -yn web3-codec-protobuf https://github.com/reuna-labs/ocaml-web3-codec.git
          opam pin add -yn evm-types           https://github.com/reuna-labs/ocaml-evm.git
          opam pin add -yn evm-abi             https://github.com/reuna-labs/ocaml-evm.git
          M=git+https://github.com/reuna-labs/mirage-crypto.git#release/web3-2.4.1-alpha1
          opam pin add -yn mirage-crypto.dev "$M"
          opam pin add -yn mirage-crypto-rng.dev "$M"
          opam pin add -yn mirage-crypto-ec.dev "$M"
          opam pin add -yn mirage-crypto-blockchain.dev "$M"
          opam pin add -yn grpc     https://github.com/reuna-labs/ocaml-grpc.git#main
          opam pin add -yn grpc-lwt https://github.com/reuna-labs/ocaml-grpc.git#main

      - run: opam install -y --assume-depexts --deps-only .

      # The genesis check is not ceremony. A Tron transaction carries no chain
      # id; the only thing binding it to a chain is a reference block taken
      # from this node. Verifying which chain that is has to happen before
      # anything is signed.
      - name: TRX transfer on Nile
        env:
          TRON_NODE: ${{ vars.TRON_NILE_NODE }}
          TRON_EXPECTED_GENESIS: ${{ vars.TRON_NILE_GENESIS }}
          TRON_SEED: ${{ secrets.TRON_NILE_SEED }}
          TRON_DESTINATION: ${{ vars.TRON_NILE_DESTINATION }}
          TRON_AMOUNT_SUN: ${{ inputs.amount_sun }}
        run: opam exec -- dune exec examples/nile_transfer.exe

      # The evidence is the point of the run, not a by-product of it.
      - name: Archive the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nile-evidence
          path: nile-evidence/
          if-no-files-found: warn
